<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixel Office</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e2e;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #cdd6f4;
        font: 18px/1.4 Consolas, 'Courier New', monospace;
        text-align: center;
      }
      #splash small {
        color: #7f849c;
        font-size: 13px;
      }
      #bits {
        color: #a6e3a1;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div>Pixel Office is waking up…</div>
      <div id="bits">0101 1101</div>
      <small
        >Waiting for the office server on 127.0.0.1:47100<br />(manual start:
        <b>pixel-agents --port 47100</b>)</small
      >
    </div>
    <script>
      // Wallpaper Engine shows only files from the wallpaper folder inside
      // frames, so instead of embedding the office this page waits for the
      // local server and then navigates to it. No token is used: an untokened
      // page is a read-only view of the office. The office page itself keeps
      // listening to Wallpaper Engine property changes (wallpaperPropertyListener).
      const PORT = 47100;
      const BASE = 'http://127.0.0.1:' + PORT;
      const settings = {
        labels: true,
        chatter: true,
        vignette: true,
        zoom: 0,
        bg: '',
        claudeSkin: 'new',
      };
      const bits = document.getElementById('bits');
      let gotProps = false;
      let leaving = false;

      function toHex(rgb) {
        const parts = String(rgb).trim().split(/\s+/).map(Number);
        if (parts.length !== 3 || parts.some((n) => !isFinite(n))) return '';
        return parts
          .map((n) =>
            Math.round(Math.min(1, Math.max(0, n)) * 255)
              .toString(16)
              .padStart(2, '0'),
          )
          .join('');
      }

      function officeUrl() {
        const q = new URLSearchParams({ wallpaper: '1' });
        q.set('labels', settings.labels ? '1' : '0');
        q.set('chatter', settings.chatter ? '1' : '0');
        q.set('vignette', settings.vignette ? '1' : '0');
        if (settings.zoom > 0) q.set('zoom', String(settings.zoom));
        if (settings.bg) q.set('bg', settings.bg);
        q.set('claudeSkin', settings.claudeSkin);
        return BASE + '/?' + q.toString();
      }

      function randomBits() {
        const n = 4 + Math.floor(Math.random() * 5);
        let s = '';
        for (let i = 0; i < n; i++) {
          if (i === 4) s += ' ';
          s += Math.random() < 0.5 ? '0' : '1';
        }
        return s;
      }
      setInterval(() => {
        bits.textContent = randomBits();
      }, 900);

      async function serverUp() {
        try {
          await fetch(BASE + '/api/health', { mode: 'no-cors', cache: 'no-store' });
          return true;
        } catch {
          return false;
        }
      }

      async function tick() {
        if (leaving) return;
        // Give Wallpaper Engine a moment to deliver the saved properties first.
        if ((await serverUp()) && (gotProps || performance.now() > 1500)) {
          leaving = true;
          location.replace(officeUrl());
          return;
        }
        setTimeout(tick, 1500);
      }
      tick();

      window.wallpaperPropertyListener = {
        applyUserProperties(p) {
          gotProps = true;
          if (p.showlabels) settings.labels = !!p.showlabels.value;
          if (p.chatter) settings.chatter = !!p.chatter.value;
          if (p.vignette) settings.vignette = !!p.vignette.value;
          if (p.zoom) settings.zoom = Math.max(0, Math.round(Number(p.zoom.value) || 0));
          if (p.backgroundcolor) settings.bg = toHex(p.backgroundcolor.value);
          if (p.claudeskin)
            settings.claudeSkin = p.claudeskin.value === 'classic' ? 'classic' : 'new';
        },
      };
    </script>
  </body>
</html>
